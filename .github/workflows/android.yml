name: Compilar APK Android - EscuelaLimpia
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo de la App
        uses: actions/checkout@v4

      - name: Instalar Qt6 y Herramientas Android
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Configurar e Inicializar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar Proyecto con CMake y generar APK
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
                -DQT_HOST_PATH="${{ env.Qt6_DIR }}" ..
          make

      - name: Subir APK final para descargar
        uses: actions/upload-artifact@v4
        with:
          name: EscuelaLimpia-Android
          path: build/**/*.apk
